build_u22:
    image: docker.io/library/ubuntu:22.04
    stage: build
    script:
        - apt update
        - apt -y install build-essential linux-headers-generic
        - ls /lib/modules
        - cd src 
        - make KERNELDIR=/lib/modules/$(ls /lib/modules)/build

