build_cc7:
    image: gitlab-registry.cern.ch/linuxsupport/cc7-base
    stage: build
    script:
        - yum install -y gcc kernel kernel-devel kernel-headers make libelf-dev elfutils-libelf-devel
        - cd src
        - make KERNELDIR=/lib/modules/$(ls /lib/modules)/build

